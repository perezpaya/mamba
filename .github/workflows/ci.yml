name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-20.04
            python-version: "3.6.15"
          - os: ubuntu-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pipenv
        run: |
          if [ "${{ matrix.python-version }}" = "3.6.15" ]; then
            python -m pip install "pipenv==2022.4.8"
          else
            python -m pip install pipenv
          fi

      - name: Install dependencies
        run: pipenv install --dev --skip-lock

      - name: Run test suite
        run: pipenv run mamba --enable-coverage

      - name: Coverage report
        run: pipenv run coverage report
